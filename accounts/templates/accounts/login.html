{% extends 'auth_base.html' %}
{% block title %}Sign in | Altrium Tracker{% endblock %}

{% block auth_content %}
<div class="auth-card">
  <div class="auth-logo">
    <span class="brand-mark">A</span>
    <span class="brand-name">Altrium Tracker</span>
  </div>
  <h1 class="auth-title">Sign in</h1>
  <p class="auth-sub">Access the recruitment workspace.</p>

  {% if form.errors %}
  <div class="alert alert-error" role="alert">Incorrect username or password. Please try again.</div>
  {% endif %}

  <form method="post" novalidate>
    {% csrf_token %}
    <div class="form-field">
      <label class="form-label" for="id_username">Username</label>
      <input type="text" name="username" class="form-input" id="id_username" autocomplete="username" required>
    </div>
    <div class="form-field">
      <label class="form-label" for="id_password">Password</label>
      <input type="password" name="password" class="form-input" id="id_password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>
  </form>
</div>
{% endblock %}
