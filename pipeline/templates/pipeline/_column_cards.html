{% if kind == 'round' %}
<div class="kanban-cards"
     data-sortable-column
     data-kind="round"
     data-round="{{ round.pk }}"
     data-status="">
  {% include 'pipeline/_card.html' with applications=applications %}
</div>
{% else %}
<div class="kanban-cards"
     data-sortable-column
     data-kind="final"
     data-round=""
     data-status="{{ status }}">
  {% include 'pipeline/_card.html' with applications=applications %}
</div>
{% endif %}
