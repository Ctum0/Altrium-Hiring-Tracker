{% if app.ai_fit_summary %}
<div class="fit-summary" id="fit-summary-{{ app.pk }}">
  <div class="fit-summary-body">{{ app.ai_fit_summary|linebreaks }}</div>
  {% if not user.is_management %}
  <div class="flex gap-2">
    <button type="button" class="btn btn-ghost btn-sm"
            hx-post="{% url 'candidates:ai_fit' app.pk %}"
            hx-target="#fit-summary-{{ app.pk }}"
            hx-swap="outerHTML"
            hx-include="[name='csrfmiddlewaretoken']">
      Regenerate
    </button>
  </div>
  {% endif %}
</div>
{% else %}
<div class="fit-summary fit-summary--empty" id="fit-summary-{{ app.pk }}">
  <span class="text-xs text-muted">No AI assessment yet.{% if user.is_management %} HR or the assigned interviewer can generate one.{% endif %}</span>
  {% if not user.is_management %}
  <button type="button" class="btn btn-primary btn-sm"
          hx-post="{% url 'candidates:ai_fit' app.pk %}"
          hx-target="#fit-summary-{{ app.pk }}"
          hx-swap="outerHTML"
          hx-include="[name='csrfmiddlewaretoken']">
    Generate AI assessment
  </button>
  {% endif %}
</div>
{% endif %}
