databases:
  - name: altrium-tracker-db
    plan: free
    databaseName: altrium_tracker
    user: altrium

services:
  - type: web
    name: altrium-tracker
    runtime: docker
    plan: free
    # seed_users creates demo accounts with a hardcoded password
    # (testpass123). Never run it unconditionally on a prod boot -- only
    # opt in explicitly (e.g. for a disposable demo/staging deploy) via
    # SEED_DEMO_USERS=true. Default (unset) is NOT to run it.
    # SEED_DEMO_DATA=true additionally runs clean_and_seed_db, which WIPES
    # all jobs/candidates/applications/feedback and seeds the enterprise
    # demo scenario. WARNING: destructive to business data -- opt-in only.
    startCommand: python manage.py collectstatic --noinput && python manage.py migrate --noinput && if [ "$SEED_DEMO_USERS" = "true" ]; then python manage.py seed_users --noinput; fi && if [ "$SEED_DEMO_DATA" = "true" ]; then python manage.py clean_and_seed_db; fi && python manage.py bootstrap_admin && gunicorn altrium_tracker.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SEED_DEMO_DATA
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: altrium-tracker-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: GROQ_API_KEY
        sync: false
      # Shared cache/rate-limit store so django-axes lockout counters are
      # consistent across all gunicorn workers (without it, each worker
      # keeps its own LocMem counter and the effective failed-login
      # threshold is silently multiplied by worker count). Provision a
      # Redis instance (e.g. Render's Key Value service) and set this
      # value manually -- required for real production lockout protection.
      - key: REDIS_URL
        sync: false
      # Object storage for CV files (Cloudflare R2). Set real values in the
      # Render dashboard after creating the bucket + API token.
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_DOMAIN
        sync: false

  # Scheduled reminder jobs (Feature 4). Both management commands default
  # to a dry run; --send makes them deliver one digest email per recipient,
  # with 24h sent-markers suppressing duplicate sends, so daily runs are
  # idempotent. Cron jobs have no free tier on Render (minimum $1/month
  # per cron job), so no plan is set -- the default compute plan applies.
  # SMTP settings (EMAIL_HOST / EMAIL_HOST_USER / EMAIL_HOST_PASSWORD) are
  # prompted at sync; without EMAIL_HOST the jobs log to console instead
  # of delivering.
  - type: cron
    name: altrium-feedback-reminders
    runtime: python
    schedule: '0 8 * * *' # daily 08:00 UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py send_feedback_reminders --send
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: altrium-tracker-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  - type: cron
    name: altrium-escalations
    runtime: python
    schedule: '30 8 * * *' # daily 08:30 UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py dispatch_escalations --send
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: altrium-tracker-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  # Weekly management digest: same aggregates as the HR dashboard KPI
  # cards, one email per active Management account (MANAGERS fallback).
  # Snapshot report, no sent-markers -- a repeat run just re-reports the
  # current numbers. Monday 09:00 UTC.
  - type: cron
    name: altrium-weekly-digest
    runtime: python
    schedule: '0 9 * * 1' # Mondays 09:00 UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py weekly_digest --send
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: altrium-tracker-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
