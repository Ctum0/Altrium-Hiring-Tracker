databases:
  - name: altrium-tracker-db
    plan: free
    databaseName: altrium_tracker
    user: altrium

services:
  - type: web
    name: altrium-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # seed_users creates demo accounts with a hardcoded password
    # (testpass123). Never run it unconditionally on a prod boot -- only
    # opt in explicitly (e.g. for a disposable demo/staging deploy) via
    # SEED_DEMO_USERS=true. Default (unset) is NOT to run it.
    startCommand: python manage.py collectstatic --noinput && python manage.py migrate --noinput && if [ "$SEED_DEMO_USERS" = "true" ]; then python manage.py seed_users --noinput; fi && gunicorn altrium_tracker.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: altrium-tracker-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: GROQ_API_KEY
        sync: false
      # Shared cache/rate-limit store so django-axes lockout counters are
      # consistent across all gunicorn workers (without it, each worker
      # keeps its own LocMem counter and the effective failed-login
      # threshold is silently multiplied by worker count). Provision a
      # Redis instance (e.g. Render's Key Value service) and set this
      # value manually -- required for real production lockout protection.
      - key: REDIS_URL
        sync: false
      # Object storage for CV files (Cloudflare R2). Set real values in the
      # Render dashboard after creating the bucket + API token.
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_DOMAIN
        sync: false
