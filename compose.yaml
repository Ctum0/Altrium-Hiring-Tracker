services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-production
      - DATABASE_URL=postgres://altrium:altrium_pass@db:5432/altrium_db
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: altrium_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=altrium_db
      - POSTGRES_USER=altrium
      - POSTGRES_PASSWORD=altrium_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
